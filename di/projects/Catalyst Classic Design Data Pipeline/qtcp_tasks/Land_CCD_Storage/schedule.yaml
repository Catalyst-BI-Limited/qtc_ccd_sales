scheduling:
  - enabled: true
    schedulingType: TIME_BASED
    timeBasedScheduling:
      schedule:
        - RRULE:FREQ=DAILY;INTERVAL=1;BYHOUR=7;BYMINUTE=15;BYSECOND=0
      startDateTime: 2026-10-02T07:15:00.0000000Z
      endDateTime: 0001-01-01T00:00:00.0000000Z
      timezone: Etc/UTC
      fullloadInterval: 0
    eventBasedScheduling:
      eventSchedulingType: ANY_INPUT_TASK
      triggerApps: []
    runOnReconnect: ONSCHEDULED
    description: ''
    version: '1'
